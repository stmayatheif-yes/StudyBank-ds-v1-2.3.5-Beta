<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>河畔小鎮</title>
<style>
:root{--ink:#1d3a35;--cel:#dde7df;--amb:#d39a2f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#a9c3b6;color:var(--ink);overscroll-behavior:none;font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.pn{background:rgba(221,231,223,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(29,58,53,.25);border-radius:12px}
button,a{font:inherit;color:var(--ink)}
.b{font-size:.85rem;padding:7px 11px;cursor:pointer;white-space:nowrap;text-decoration:none;display:flex;align-items:center;border:1px solid rgba(29,58,53,.25)}
#top{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
#top .row{display:flex;gap:6px;align-items:stretch}
#top .pn{pointer-events:auto}
#hud{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4px 10px;line-height:1.3;min-width:0}
#hud b{font-size:1.05rem;letter-spacing:.14em}
#clk{font-size:.78rem;opacity:.8}
#stats{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 12px;font-size:.82rem}
#stats b{font-size:1rem}
#bReset{padding:3px 9px;font-size:.78rem;background:transparent;border-radius:8px;cursor:pointer;border:1px solid rgba(29,58,53,.3)}
#zoom{position:fixed;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
#zoom .b{justify-content:center;width:40px;height:40px;font-size:1.1rem}
#msg{position:fixed;left:50%;bottom:calc(142px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 14px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#msg.show{opacity:1}
#sub{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:none;gap:6px;padding:6px;overflow-x:auto}
.ch{flex:0 0 auto;background:transparent;border:1px solid rgba(29,58,53,.25);border-radius:9px;padding:5px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.ch small{font-size:.7rem;opacity:.75}
.ch.on{background:var(--amb);border-color:#8a5f12;color:#2a1d05}
#card{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:8px;padding:10px 12px}
#card .rw{display:flex;gap:8px}
#card button{flex:1;padding:8px;border-radius:9px;border:1px solid rgba(29,58,53,.3);background:transparent;cursor:pointer}
#cardDel{background:var(--amb)!important;border-color:#8a5f12!important}
#bar{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;overflow-x:auto}
.tb{flex:1 0 58px;background:transparent;border:1px solid rgba(29,58,53,.2);border-radius:9px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.tb small{font-size:.7rem;opacity:.75;min-height:1em}
.tb.on{background:var(--amb);border-color:#8a5f12;color:#2a1d05}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(29,58,53,.5);padding:20px}
#intro .pn{max-width:340px;padding:20px}
#intro h2{margin:0 0 6px;letter-spacing:.16em}
#intro ol{padding-left:1.3em;line-height:1.9;margin:8px 0}
#intro p{margin:6px 0;font-size:.88rem;opacity:.85;line-height:1.7}
#go{width:100%;margin-top:10px;padding:10px;background:var(--amb);border:1px solid #8a5f12;border-radius:9px;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <div class="row">
    <a class="pn b" href="index.html">← 題庫</a>
    <div class="pn" id="hud"><b>河畔小鎮</b><span id="clk"></span></div>
    <button class="pn b" id="bSpd" aria-label="遊戲速度">1×</button>
    <button class="pn b" id="bPause">暫停</button>
  </div>
  <div class="pn" id="stats">
    <span>居民 <b id="sPop">0</b></span><span>建築 <b id="sB">0</b></span><span>街道 <b id="sR">0</b></span><span>鎮庫 <b id="sM">0</b> 文</span>
    <button id="bReset">重來</button>
  </div>
</div>
<div id="zoom"><button class="pn b" id="zi" aria-label="放大">＋</button><button class="pn b" id="zo" aria-label="縮小">－</button><button class="pn b" id="zh" aria-label="回到小鎮">⌖</button></div>
<div id="msg" class="pn"></div>
<div id="sub" class="pn"></div>
<div id="card" class="pn"><div id="cardT"></div><div class="rw"><button id="cardDel"></button><button id="cardX">關閉</button></div></div>
<div id="bar" class="pn"></div>
<div id="intro"><div class="pn">
  <h2>河畔小鎮</h2>
  <p>在河岸邊，一格一格把小鎮鋪起來。</p>
  <ol><li>選「鋪路」，從河岸邊的碼頭拖出一條青石路。</li><li>選「民居」，點在路旁的空地，等它落成。</li><li>居民搬進來後，再蓋商鋪和作坊，賺取鎮庫。</li></ol>
  <p>單指拖曳移動畫面（鋪路和拆除時改用兩指），兩指縮放。世界很大，右側的 ⌖ 可以隨時回到你的小鎮。進度會自動存在這支手機上。</p>
  <button id="go">開始建造</button>
</div></div>

<script>
(() => {
"use strict";
const N = 10000, RX = 5004, HW = 32, HH = 16, DOCK = { x: 5003, y: 5000 }, KEY = "town_save_v2", ROAD = 20;
const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const CAT = {
  house: [{ id: "h1", n: "民居", c: 80, h: 20, r: 13, w: ["#ece1c8", "#cdc0a1"], f: ["#7a928d", "#566b68", "#8aa39e"] }],
  shop: [
    { id: "s1", n: "雜貨鋪", c: 120, h: 24, r: 14, w: ["#dbb88f", "#b99671"], f: ["#d1604a", "#a23f2b", "#e07a63"], d: "lan", inc: 6 },
    { id: "s2", n: "茶坊", c: 140, h: 24, r: 14, w: ["#d9c9a0", "#b8a77d"], f: ["#4f7b6b", "#3a5c50", "#62917f"], d: "flag", inc: 7 },
    { id: "s3", n: "食肆", c: 160, h: 26, r: 14, w: ["#e4c9a4", "#c2a681"], f: ["#a8553a", "#85402b", "#bd6b4f"], d: "lan", inc: 8 },
    { id: "s4", n: "布莊", c: 150, h: 24, r: 13, w: ["#e8dcc8", "#c9bb9f"], f: ["#3e5f8a", "#2f4a6c", "#5276a3"], d: "cloth", inc: 8 },
    { id: "s5", n: "藥鋪", c: 170, h: 24, r: 14, w: ["#d8cdb3", "#b7ab8f"], f: ["#6a7f4f", "#52643c", "#7f9663"], d: "sign", inc: 9 },
    { id: "s6", n: "酒樓", c: 260, h: 38, r: 16, w: ["#e2b58c", "#bf9168"], f: ["#b8452e", "#8f3320", "#cf5c43"], d: "lan2", inc: 15, bt: 30 }
  ],
  work: [
    { id: "w1", n: "陶坊", c: 150, h: 22, r: 11, w: ["#bf9f7e", "#9c7f61"], f: ["#8a6650", "#684a38", "#9c7863"], d: "kiln", inc: 9 },
    { id: "w2", n: "木作坊", c: 150, h: 22, r: 11, w: ["#c9ad82", "#a68b63"], f: ["#6f5a3f", "#54432e", "#836c4e"], d: "logs", inc: 9 },
    { id: "w3", n: "織坊", c: 170, h: 22, r: 12, w: ["#e0d2b6", "#bfb094"], f: ["#8a5f7a", "#6c4960", "#a0768f"], d: "yarn", inc: 11 },
    { id: "w4", n: "鐵鋪", c: 200, h: 22, r: 11, w: ["#a9a49a", "#878279"], f: ["#5b5f66", "#44474d", "#6e737b"], d: "anvil", inc: 14 },
    { id: "w5", n: "釀酒坊", c: 220, h: 24, r: 12, w: ["#d3b891", "#b09670"], f: ["#7b5b3e", "#5e432d", "#8f6e4f"], d: "jars", inc: 16 }
  ],
  park: [
    { id: "p1", n: "垂柳", c: 60, k: "willow", bt: 6 }, { id: "p2", n: "花圃", c: 50, k: "flower", bt: 6 },
    { id: "p3", n: "池塘", c: 90, k: "pond", bt: 8 }, { id: "p4", n: "涼亭", c: 140, k: "pavilion", bt: 10 },
    { id: "p5", n: "竹林", c: 70, k: "bamboo", bt: 6 }, { id: "p6", n: "假山", c: 110, k: "rock", bt: 8 }
  ]
};
const TY = {}; Object.keys(CAT).forEach(c => CAT[c].forEach(v => { v.cat = c; TY[v.id] = v; }));
const TOOLS = [["look", "探索"], ["road", "鋪路"], ["house", "民居"], ["shop", "商鋪"], ["work", "作坊"], ["park", "園景"], ["del", "拆除"]];
const $ = s => document.querySelector(s);
const cv = $("#cv"), cx = cv.getContext("2d");
let roads = new Set(), bm = new Map(), conn = new Set(), CR = [], R = [];
let S = { m: 2400, t: 120 }, speed = 1, paused = false, tool = "road", acc = 0, Z = 1, cam = { x: 0, y: 0 };
let sel = { house: "h1", shop: "s1", work: "w1", park: "p1" };
let hov = null, VW = 0, VH = 0, DPR = 1, introOpen = false, cardB = null;

const K = (x, y) => y * N + x;
const inW = (x, y) => x >= 0 && y >= 0 && x < N && y < N;
const isW = (x, y) => x >= RX && x < RX + 2;
const P = (x, y, z) => [(x - y) * HW, (x + y) * HH - (z || 0)];
const hs = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0;
const hr = () => (S.t / 15) % 24;
const dark = h => (h >= 20 || h < 4) ? 1 : h >= 18 ? (h - 18) / 2 : h < 6 ? (6 - h) / 2 : 0;
const pad = n => String(n).padStart(2, "0");
const SH = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
const GR = ["#a6ba72", "#9db46b", "#abbf79"], WC = [];
for (let i = 0; i < 8; i++) WC.push("hsl(197 42% " + (47 + i * .9) + "%)");

// ===== 存檔（只存道路與建築，世界其他部分由程式生成） =====
let sv = 0; const dirty = () => { clearTimeout(sv); sv = setTimeout(save, 400); };
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ v: 2, rd: Array.from(roads), b: Array.from(bm.values()).map(b => [b.t, b.x, b.y, +b.p.toFixed(3), b.r, b.c]), m: S.m, t: S.t, cam: { x: cam.x, y: cam.y, z: Z }, tool: tool, sel: sel, sp: speed })); } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY)); if (!d || d.v !== 2) return false;
    roads = new Set(d.rd); bm = new Map();
    d.b.forEach(a => { if (TY[a[0]]) bm.set(K(a[1], a[2]), { t: a[0], x: a[1], y: a[2], p: a[3], r: a[4], c: a[5] }); });
    S = { m: d.m, t: d.t }; if (d.cam) { cam.x = d.cam.x; cam.y = d.cam.y; Z = d.cam.z || Z; }
    if (d.sel) sel = Object.assign(sel, d.sel); if (d.tool) tool = d.tool; if (d.sp) { speed = d.sp; $("#bSpd").textContent = speed + "×"; }
    return true;
  } catch (e) { return false; }
}
function migrate() {   // 把舊版 16×16 小鎮搬進新世界
  try {
    const d = JSON.parse(localStorage.getItem("town_save_v1")); if (!d || d.v !== 1 || d.g.length !== 256) return false;
    const ox = DOCK.x - 13, oy = DOCK.y - 7, MT = { house: ["h1", 80], shop: ["s1", 120], work: ["w1", 150], park: ["p1", 60] };
    roads = new Set(); bm = new Map();
    for (let i = 0; i < 256; i++) if (d.g[i] === "2") roads.add(K(i % 16 + ox, ((i / 16) | 0) + oy));
    d.b.forEach(b => { const m = MT[b.t]; if (m) bm.set(K(b.x + ox, b.y + oy), { t: m[0], x: b.x + ox, y: b.y + oy, p: b.p, r: b.r || 0, c: m[1] }); });
    S = { m: d.m, t: d.t }; return true;
  } catch (e) { return false; }
}
function fresh() { roads = new Set([K(DOCK.x, DOCK.y)]); bm = new Map(); S = { m: 2400, t: 120 }; centerOn(DOCK.x - 2, DOCK.y + 2); }
function centerOn(x, y) { cam.x = (x - y) * HW; cam.y = (x + y) * HH; }
function home() {
  let sx = 0, sy = 0, n = 0; bm.forEach(b => { sx += b.x; sy += b.y; n++; });
  if (n) centerOn(sx / n, sy / n); else centerOn(DOCK.x - 2, DOCK.y + 2); clampCam(); dirty();
}

// ===== 道路連通：只有接到河岸的路才算通 =====
function calcConn() {
  conn = new Set(); CR = []; const q = [];
  roads.forEach(k => { const x = k % N, y = (k / N) | 0; if (D4.some(d => isW(x + d[0], y + d[1]))) { conn.add(k); q.push(k); } });
  while (q.length) {
    const k = q.pop(), x = k % N, y = (k / N) | 0; CR.push(k);
    for (const d of D4) { const a = x + d[0], b = y + d[1]; if (!inW(a, b)) continue; const j = K(a, b); if (roads.has(j) && !conn.has(j)) { conn.add(j); q.push(j); } }
  }
}
const roadAdj = (x, y) => D4.some(d => { const a = x + d[0], b = y + d[1]; return inW(a, b) && conn.has(K(a, b)); });
const ok = b => TY[b.t].cat === "park" || roadAdj(b.x, b.y);

// ===== 提示、資訊卡 =====
let mt;
function say(m) { const e = $("#msg"); e.textContent = m; e.classList.add("show"); clearTimeout(mt); mt = setTimeout(() => e.classList.remove("show"), 2600); }
function showCard(b) {
  cardB = b; const T = TY[b.t];
  const st = b.p < 1 ? "興建中 " + Math.floor(b.p * 100) + "%" : T.cat === "house" ? "住戶 " + b.r + "/4" : T.cat === "park" ? "景觀" : "運作中";
  $("#cardT").textContent = T.n + "・" + st + (ok(b) ? "" : "（沒有連到河岸的路）");
  $("#cardDel").textContent = "移除（退還 " + b.c + " 文）"; $("#card").style.display = "flex";
}
function hideCard() { cardB = null; $("#card").style.display = "none"; }
function removeB(b) {
  S.m += b.c; bm.delete(K(b.x, b.y)); syncRes(); hideCard(); say("已移除 " + TY[b.t].n + "，退還 " + b.c + " 文"); dirty();
}
$("#cardDel").onclick = () => { if (cardB) removeB(cardB); };
$("#cardX").onclick = hideCard;

// ===== 操作 =====
const curT = () => tool === "road" ? { c: ROAD, cat: "road" } : TY[sel[tool]];
function act(x, y) {
  if (!inW(x, y)) return;
  const k = K(x, y), b = bm.get(k);
  if (tool === "look") { if (b) showCard(b); else { hideCard(); say(isW(x, y) ? "河水" : roads.has(k) ? (conn.has(k) ? "青石路" : "青石路（還沒接到河岸）") : "空地"); } return; }
  if (tool === "del") {
    if (b) removeB(b);
    else if (roads.has(k)) { roads.delete(k); S.m += ROAD; calcConn(); syncRes(); dirty(); }
    else say("這裡沒有可以拆的東西");
    return;
  }
  if (isW(x, y)) return say("河面上不能蓋");
  if (roads.has(k) || b) return say("這格已經有東西了");
  const T = curT(); if (S.m < T.c) return say("鎮庫不足，需要 " + T.c + " 文");
  if (tool === "road") { roads.add(k); S.m -= ROAD; calcConn(); dirty(); return; }
  if (T.cat !== "park" && !roadAdj(x, y)) return say("旁邊沒有路：要先把路接到河岸");
  S.m -= T.c; bm.set(k, { t: T.id, x: x, y: y, p: 0, r: 0, c: T.c }); dirty();
}
function can(x, y) {
  const k = K(x, y);
  if (tool === "del") return bm.has(k) || roads.has(k);
  if (isW(x, y) || roads.has(k) || bm.has(k)) return false;
  const T = curT(); if (S.m < T.c) return false;
  return tool === "road" || T.cat === "park" || roadAdj(x, y);
}
function renderSub() {
  const e = $("#sub"), L = CAT[tool];
  if (!L || L.length < 2) { e.style.display = "none"; return; }
  e.style.display = "flex";
  e.innerHTML = L.map(v => '<button class="ch' + (sel[tool] === v.id ? " on" : "") + '" data-id="' + v.id + '"><span>' + v.n + "</span><small>" + v.c + "文</small></button>").join("");
}
$("#sub").onclick = e => { const b = e.target.closest(".ch"); if (!b) return; sel[tool] = b.dataset.id; renderSub(); updBar(); dirty(); };
function updBar() {
  document.querySelectorAll(".tb").forEach(b => {
    const k = b.dataset.k, L = CAT[k]; b.classList.toggle("on", k === tool);
    b.querySelector("small").textContent = k === "road" ? ROAD + "文" : L ? TY[sel[k]].c + "文" : "";
  });
}
function pick(k) {
  tool = k; hideCard(); renderSub(); updBar();
  say({ look: "拖曳移動畫面，點建築可以查看或移除", road: "拖曳鋪路（兩指移動畫面）", del: "點擊或拖曳拆除，退還建造費用", park: "園景可蓋在任何空地，不用靠路" }[k] || "點擊空地建造，要蓋在路旁");
  dirty();
}
TOOLS.forEach(t => {
  const b = document.createElement("button"); b.className = "tb"; b.dataset.k = t[0];
  b.innerHTML = "<span>" + t[1] + "</span><small></small>"; b.onclick = () => pick(t[0]); $("#bar").appendChild(b);
});

// ===== 模擬 =====
function syncRes() {
  let pop = 0; bm.forEach(b => { if (b.p >= 1) pop += b.r; }); pop = Math.min(36, pop);
  while (R.length < pop && CR.length) { const k = CR[Math.random() * CR.length | 0]; R.push({ x: k % N + .5, y: ((k / N) | 0) + .5, tx: k % N, ty: (k / N) | 0, px: -1, py: -1, c: Math.random() * 4 | 0, w: Math.random() * 6 }); }
  while (R.length > pop) R.pop();
}
function moveRes(d) {
  R.forEach(r => {
    if (!conn.has(K(r.tx, r.ty))) { if (!CR.length) return; const k = CR[Math.random() * CR.length | 0]; r.tx = k % N; r.ty = (k / N) | 0; r.x = r.tx + .5; r.y = r.ty + .5; r.px = -1; }
    const gx = r.tx + .5, gy = r.ty + .5, dx = gx - r.x, dy = gy - r.y, dd = Math.hypot(dx, dy), v = d * 1.1;
    if (dd > v) { r.x += dx / dd * v; r.y += dy / dd * v; return; }
    r.x = gx; r.y = gy;
    const n = D4.map(a => [r.tx + a[0], r.ty + a[1]]).filter(a => inW(a[0], a[1]) && conn.has(K(a[0], a[1])));
    if (!n.length) return;
    let c = n.filter(a => !(a[0] === r.px && a[1] === r.py)); if (!c.length) c = n;
    const nx = c[Math.random() * c.length | 0]; r.px = r.tx; r.py = r.ty; r.tx = nx[0]; r.ty = nx[1];
  });
}
function tick() {
  let pop = 0, shop = 0, work = 0, pk = 0, hasS = false, hasW = false;
  bm.forEach(b => {
    if (b.p < 1) return; const T = TY[b.t];
    if (T.cat === "park") { pk++; return; } if (!ok(b)) return;
    pop += b.r; if (T.cat === "shop") { shop += T.inc; hasS = true; } if (T.cat === "work") { work += T.inc; hasW = true; }
  });
  S.m += Math.floor(pop * 1.5) + (pop > 0 ? shop + pk : 0) + (hasS ? work : 0); syncRes();
}
function step(d) {
  S.t += d;
  bm.forEach(b => {
    const T = TY[b.t];
    if (b.p < 1) b.p = Math.min(1, b.p + d / (T.bt || 18));
    else if (T.cat === "house" && b.r < 4 && ok(b)) { b.mv = (b.mv || 0) + d; if (b.mv >= 4) { b.mv = 0; b.r++; syncRes(); } }
  });
  acc += d; if (acc >= 10) { acc -= 10; tick(); }
  moveRes(d);
}

// ===== 繪圖 =====
function poly(pts, fill, stroke) {
  cx.beginPath(); cx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) cx.lineTo(pts[i][0], pts[i][1]); cx.closePath();
